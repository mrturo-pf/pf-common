name: Debug CI (Reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        description: 'Repository name (pf-rates, pf-payroll)'
        required: true
        type: string
      checkout_db:
        description: 'Whether to checkout pf-db for integration tests'
        required: false
        type: boolean
        default: false

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout target repository
      - name: Checkout ${{ inputs.repo_name }}
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.repo_name }}

      # Checkout pf-common
      - name: Checkout pf-common
        uses: actions/checkout@v4
        with:
          repository: mrturo-pf/pf-common
          path: pf-common

      # Checkout pf-db (conditional, only if needed)
      - name: Checkout pf-db
        if: ${{ inputs.checkout_db }}
        uses: actions/checkout@v4
        with:
          repository: mrturo-pf/pf-db
          path: _pf-db

      # Setup Python
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Debug: Environment info
      - name: Debug - Environment info
        run: |
          echo "========================================="
          echo "ENVIRONMENT INFORMATION"
          echo "========================================="
          echo "Working directory: $(pwd)"
          echo "Python version: $(python --version)"
          echo "pip version: $(pip --version)"
          echo ""
          echo "========================================="
          echo "DIRECTORY STRUCTURE"
          echo "========================================="
          ls -la
          echo ""
          echo "========================================="
          echo "${{ inputs.repo_name }} CONTENT"
          echo "========================================="
          ls -la ${{ inputs.repo_name }}/
          echo ""
          echo "========================================="
          echo "PF-COMMON CONTENT"
          echo "========================================="
          ls -la pf-common/
          if [ "${{ inputs.checkout_db }}" == "true" ]; then
            echo ""
            echo "========================================="
    echo "PF-DB CONTENT"
            echo "========================================="
            ls -la _pf-db/ | head -20
          fi

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Install Trivy
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          echo ""
          echo "Trivy version:"
          trivy --version

      # Install dependencies
      - name: Install dependencies
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "========================================="
          make install
          echo ""
          echo "========================================="
          echo "INSTALLED PACKAGES"
          echo "========================================="
          .venv/bin/pip list

      # Debug: Tool versions
      - name: Debug - Tool versions
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "TOOL VERSIONS"
          echo "========================================="
          echo "ruff version:"
          PATH=".venv/bin:$PATH" ruff --version
          echo ""
          echo "pytest version:"
          .venv/bin/pytest --version
          echo ""
          echo "mypy version:"
          .venv/bin/mypy --version
          echo ""
          echo "vulture version:"
          .venv/bin/vulture --version 2>/dev/null || echo "vulture not found"

      # Step 1: Lint (fix mode)
      - name: Step 1 - Lint (fix mode)
        working-directory: ${{ inputs.repo_name }}
        env:
          PF_DB_PATH: ${{ inputs.checkout_db && github.workspace || '' }}/_pf-db
        run: |
          echo "========================================="
          echo "STEP 1: LINT (FIX MODE)"
          echo "========================================="
          PATH=".venv/bin:$PATH" ruff check --fix --exit-zero src tests
          echo "Exit code: $?"

      # Step 2: Format
      - name: Step 2 - Format
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 2: FORMAT"
          echo "========================================="
          PATH=".venv/bin:$PATH" ruff format src tests
          echo "Exit code: $?"

      # Step 3: Lint (strict mode)
      - name: Step 3 - Lint (strict mode)
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 3: LINT (STRICT MODE)"
          echo "========================================="
          PATH=".venv/bin:$PATH" ruff check src tests 2>&1 | tee /tmp/lint-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "LINT ERRORS FOUND"
            echo "========================================="
            cat /tmp/lint-output.txt
            echo ""
            echo "Continuing to next step..."
          fi
          exit 0

      # Step 4: Dead code detection
      - name: Step 4 - Dead code
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 4: DEAD CODE DETECTION"
          echo "========================================="
          make dead-code || true
          echo "Exit code: $?"

      # Step 5: Type check
      - name: Step 5 - Type check
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 5: TYPE CHECK"
          echo "========================================="
          make typecheck 2>&1 | tee /tmp/typecheck-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "TYPE CHECK ERRORS"
            echo "========================================="
            cat /tmp/typecheck-output.txt
            exit 1
          fi

      # Step 6: Duplicate code detection
      - name: Step 6 - Duplicate code
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 6: DUPLICATE CODE DETECTION"
          echo "========================================="
          echo "Checking source code..."
          make duplicate-code-src || true
          echo ""
          echo "Checking test code..."
          make duplicate-code-tests || true
          echo "Exit code: $?"

      # Step 7: Tests
      - name: Step 7 - Tests
        working-directory: ${{ inputs.repo_name }}
        env:
          PF_DB_PATH: ${{ inputs.checkout_db && github.workspace || '' }}/_pf-db
        run: |
          echo "========================================="
          echo "STEP 7: TESTS"
          echo "========================================="
          if [ "${{ inputs.checkout_db }}" == "true" ]; then
            echo "PF_DB_PATH is set to: $PF_DB_PATH"
            echo ""
          fi
          make test-cov 2>&1 | tee /tmp/test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "TEST ERRORS"
            echo "========================================="
            cat /tmp/test-output.txt
            exit 1
          fi

      # Step 8: Security scan
      - name: Step 8 - Security scan
        working-directory: ${{ inputs.repo_name }}
        run: |
          echo "========================================="
          echo "STEP 8: SECURITY SCAN"
          echo "========================================="
          make security-scan 2>&1 | tee /tmp/security-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "SECURITY SCAN ERRORS"
            echo "========================================="
            cat /tmp/security-output.txt
            exit 1
          fi

      # Final summary
      - name: Final Summary
        if: always()
        run: |
          echo "========================================="
          echo "DEBUG WORKFLOW COMPLETED"
          echo "========================================="
          echo "Repository: ${{ inputs.repo_name }}"
          echo "Checkout DB: ${{ inputs.checkout_db }}"
          echo "Check individual steps above for details"
