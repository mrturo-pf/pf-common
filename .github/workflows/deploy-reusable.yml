# ==============================================================================
# REUSABLE Cloud Run Deploy Pipeline
# ==============================================================================
#
# This reusable workflow provides CI/CD for PF microservices deploying to GCP
# Cloud Run. It eliminates duplication by centralizing the 6-job pipeline:
#   1. test      - Lint, typecheck, coverage, security scan
#   2. build     - Docker build, Trivy scan, artifact packaging
#   3. gate      - Manual approval (production environment)
#   4. deploy    - Push to Artifact Registry, deploy to Cloud Run
#   5. notify-failure  - Email on pipeline failure
#   6. notify-success  - Email on successful deployment
#
# USAGE FROM REPOS:
#
# ```yaml
# name: CI / Deploy to Cloud Run
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#
# jobs:
#   deploy:
#     uses: mrturo-pf/pf-common/.github/workflows/deploy-reusable.yml@main
#     with:
#       repo_name: pf-rates  # or pf-payroll
#     secrets: inherit  # REQUIRED - passes all GitHub secrets to the workflow
# ```
#
# REQUIRED GITHUB SECRETS (must exist in calling repo):
#   GCP_SA_KEY               - GCP service account JSON key
#   GCP_PROJECT_ID           - GCP project ID
#   GCP_CLOUD_SQL_INSTANCE   - (optional) Cloud SQL instance for proxy sidecar
#   GH_PAT                   - (optional) GitHub PAT for private repo access
#   MAIL_SERVER              - SMTP server (e.g. smtp.gmail.com)
#   MAIL_PORT                - SMTP port (e.g. 587)
#   MAIL_USERNAME            - SMTP username
#   MAIL_PASSWORD            - SMTP password
#   MAIL_FROM                - Sender address
#   MAIL_TO                  - Recipient address(es)
#
# Repository-specific secrets are accessed automatically (e.g. PF_RATES_API_KEY,
# PF_PAYROLL_API_KEY, PF_RATES_URL) when they exist.
#
# ENVIRONMENTS REQUIRED:
#   - production (with required reviewers for manual approval)
#   - GCP (for deployment credentials)
#
# For detailed setup instructions, see docs/deployment.md in each repository.
#
# ==============================================================================

name: Deploy to Cloud Run (Reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        description: 'Repository name (pf-rates, pf-payroll, etc.)'
        required: true
        type: string
      require_approval:
        description: 'Require manual approval before deployment (production gate)'
        required: false
        type: boolean
        default: true

env:
  REGION: us-central1
  AR_REPO: ${{ inputs.repo_name }}
  SERVICE_NAME: ${{ inputs.repo_name }}
  RUNTIME_SA: ${{ inputs.repo_name }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

# NOTE: permissions must be declared by the CALLER workflow, not here

jobs:
  # ----------------------------------------------------------------------------
  # test: lint, static analysis, unit + integration tests
  # ----------------------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ inputs.repo_name }}
        uses: actions/checkout@v7
        with:
          path: ${{ inputs.repo_name }}

      # pf-common provides shared Makefile targets (lint, dead-code, etc.)
      - name: Checkout pf-common
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: pf-common
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ inputs.repo_name }}/pyproject.toml

      - name: Install dependencies
        working-directory: ${{ inputs.repo_name }}
        run: pip install -e ".[dev]"

      # pf-db is checked out as a sibling (_pf-db/) so conftest.py can read the
      # SQL test fixtures (schema + seed) without duplicating them in this repo.
      - name: Checkout pf-db (SQL test fixtures)
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-db
          path: _pf-db
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Lint (ruff)
        working-directory: ${{ inputs.repo_name }}
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Dead code (vulture)
        working-directory: ${{ inputs.repo_name }}
        run: make dead-code

      - name: Type check (mypy)
        working-directory: ${{ inputs.repo_name }}
        run: make typecheck

      - name: Duplicate code (jscpd)
        working-directory: ${{ inputs.repo_name }}
        run: |
          make duplicate-code-src
          make duplicate-code-tests
          make duplicate-code

      - name: Run tests with coverage
        working-directory: ${{ inputs.repo_name }}
        env:
          PF_DB_PATH: ../_pf-db
        run: make test-cov

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Security scan (trivy fs)
        working-directory: ${{ inputs.repo_name }}
        run: make security-scan

  # ----------------------------------------------------------------------------
  # build: Docker image build, Trivy security scan, release artifact
  # Runs on every push/PR so security findings surface early.
  # The release artifact (tagged for AR) is only produced on push to main.
  # ----------------------------------------------------------------------------
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout ${{ inputs.repo_name }}
        uses: actions/checkout@v7
        with:
          path: ${{ inputs.repo_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build image locally so Trivy can scan it without pushing first.
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.repo_name }}
          push: false
          load: true
          tags: ${{ inputs.repo_name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export the image to a tar file for reliable Trivy scanning in CI
      - name: Export image to tar for scanning
        run: docker save ${{ inputs.repo_name }}:scan -o /tmp/${{ inputs.repo_name }}-scan.tar

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      # Pass 1: SARIF for GitHub Security tab (exit-code 0 — always creates file)
      - name: Trivy scan — SARIF
        run: |
          trivy image \
            --input /tmp/${{ inputs.repo_name }}-scan.tar \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Pass 2: pipeline gate — blocks on CRITICAL/HIGH with available fixes
      - name: Trivy scan — pipeline gate
        run: |
          trivy image \
            --input /tmp/${{ inputs.repo_name }}-scan.tar \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      # Tag and package the release artifact — only needed when deploying
      - name: Tag image for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ inputs.repo_name }}:scan \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker tag ${{ inputs.repo_name }}:scan \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest

      - name: Export release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest \
            -o /tmp/${{ inputs.repo_name }}-release.tar

      - name: Upload release image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-release-${{ github.sha }}
          path: /tmp/${{ inputs.repo_name }}-release.tar
          retention-days: 1

  # ----------------------------------------------------------------------------
  # gate: manual approval before deploying (only on push to main)
  # Configure required reviewers for the "production" environment in:
  #   GitHub → Settings → Environments → production → Required reviewers
  # ----------------------------------------------------------------------------
  gate:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.require_approval
    environment: production

    steps:
      - name: Deployment approved
        run: echo "Manual approval granted — proceeding to deploy."

  # ----------------------------------------------------------------------------
  # deploy: push image to AR, deploy to Cloud Run (only on push to main)
  # Migrations are handled by pf-db before this service receives traffic.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: gate
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    environment: GCP

    steps:
      - name: Download release image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-release-${{ github.sha }}
          path: /tmp

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Cost-control guard: block the pipeline if Artifact Registry vulnerability
      # scanning is enabled on the repository — it adds ~$5/month per image.
      - name: Verify Artifact Registry scanning is disabled
        run: |
          set -euo pipefail

          if ! STATUS=$(gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
              --location="${{ env.REGION }}" \
              --format="value(vulnerabilityScanningConfig.enablementConfig)" 2>&1); then
            echo " Cannot access Artifact Registry repo '${{ env.AR_REPO }}'"
            echo "Create it first: gcloud artifacts repositories create ${{ env.AR_REPO }} --repository-format=docker --location=${{ env.REGION }}"
            echo "$STATUS"
            exit 1
          fi

          STATUS=$(echo "$STATUS" | grep -E '^(ENABLED|DISABLED)$' | tail -1 || true)
          echo "Vulnerability scanning: ${STATUS:-unknown}"

          if [ "${STATUS}" = "ENABLED" ]; then
            echo " Vulnerability scanning is ENABLED — blocking deploy to prevent ~\$5/month charges."
            echo "Fix: gcloud artifacts repositories update ${{ env.AR_REPO }} --location=${{ env.REGION }} --disable-vulnerability-scanning"
            exit 1
          fi
          echo " Vulnerability scanning disabled."

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Load and push image to Artifact Registry
        run: |
          docker load -i /tmp/${{ inputs.repo_name }}-release.tar
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest

      # Deploy the new service revision.
      # Secret names follow convention: PF_<UPPERCASE_REPO_NAME>_API_KEY
      # e.g., pf-rates → PF_RATES_API_KEY, pf-payroll → PF_PAYROLL_API_KEY
      - name: Deploy to Cloud Run
        run: |
          set -eo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          # Secret Manager secrets
          # Always include PF_DATABASE_URL
          # API key follows naming convention: PF_<UPPERCASE_REPO_NAME>_API_KEY
          REPO_UPPER=$(echo "${{ inputs.repo_name }}" | tr '[:lower:]-' '[:upper:]_')
          API_KEY_SECRET="PF_${REPO_UPPER}_API_KEY"
          SECRETS_ARG="PF_DATABASE_URL=PF_DATABASE_URL:latest,${API_KEY_SECRET}=${API_KEY_SECRET}:latest"

          # Optional: PF_RATES_API_KEY for pf-payroll (calling pf-rates)
          if [ "${{ inputs.repo_name }}" = "pf-payroll" ]; then
            SECRETS_ARG="${SECRETS_ARG},PF_RATES_API_KEY=PF_RATES_API_KEY:latest"
          fi

          # Build gcloud command with optional Cloud SQL instance
          echo "Building deployment command..."
          GCLOUD_CMD="gcloud run deploy ${{ env.SERVICE_NAME }}"
          GCLOUD_CMD="$GCLOUD_CMD --image=${IMAGE}"
          GCLOUD_CMD="$GCLOUD_CMD --region=${{ env.REGION }}"
          GCLOUD_CMD="$GCLOUD_CMD --platform=managed"
          GCLOUD_CMD="$GCLOUD_CMD --allow-unauthenticated"
          GCLOUD_CMD="$GCLOUD_CMD --service-account=${{ env.RUNTIME_SA }}"
          GCLOUD_CMD="$GCLOUD_CMD --min-instances=0"
          GCLOUD_CMD="$GCLOUD_CMD --max-instances=2"
          GCLOUD_CMD="$GCLOUD_CMD --memory=512Mi"
          GCLOUD_CMD="$GCLOUD_CMD --cpu=1"
          GCLOUD_CMD="$GCLOUD_CMD --port=8080"
          GCLOUD_CMD="$GCLOUD_CMD --set-secrets=${SECRETS_ARG}"
          GCLOUD_CMD="$GCLOUD_CMD --set-env-vars=FINANCIAL_DATA_HTTP_PROXY="
          GCLOUD_CMD="$GCLOUD_CMD --quiet"
          
          # Add Cloud SQL instance if provided
          CLOUDSQL_INSTANCE="${{ secrets.GCP_CLOUD_SQL_INSTANCE || '' }}"
          if [ -n "${CLOUDSQL_INSTANCE}" ]; then
            echo "Adding Cloud SQL instance: ${CLOUDSQL_INSTANCE}"
            GCLOUD_CMD="$GCLOUD_CMD --add-cloudsql-instances=${CLOUDSQL_INSTANCE}"
          else
            echo "No Cloud SQL instance configured (optional)"
          fi
          
          # Execute deployment
          echo "Executing: ${GCLOUD_CMD}"
          eval "${GCLOUD_CMD}"

      - name: Print deployed service URL
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)"

  # ----------------------------------------------------------------------------
  # notify-failure: email alert when any job fails on push to main
  # ----------------------------------------------------------------------------
  notify-failure:
    name: Notify — Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')

    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: " [${{ inputs.repo_name }}] Pipeline failed — ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            One or more jobs failed in the ${{ inputs.repo_name }} CI/CD pipeline.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Author:  ${{ github.actor }}

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ----------------------------------------------------------------------------
  # notify-success: email confirmation after a successful full deploy
  # ----------------------------------------------------------------------------
  notify-success:
    name: Notify — Success
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: " [${{ inputs.repo_name }}] Deployed successfully — ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            ${{ inputs.repo_name }} deployed successfully to Cloud Run.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Author:  ${{ github.actor }}

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
