# ==============================================================================
# REUSABLE Cloud Run Deploy Pipeline
# ==============================================================================
#
# This reusable workflow provides CI/CD for PF microservices deploying to GCP
# Cloud Run. It eliminates duplication by centralizing the 6-job pipeline:
#   1. test      - Lint, typecheck, coverage, security scan
#   2. build     - Docker build, Trivy scan, artifact packaging
#   3. deploy    - Push to Artifact Registry, deploy to Cloud Run
#   4. smoke-test - Curl the deployed /health endpoint; verify it's the
#                    right service and a genuinely fresh revision
#   5. notify-failure  - Email on pipeline failure
#   6. notify-success  - Email on successful, verified deployment
#
# USAGE FROM REPOS:
#
# ```yaml
# name: CI / Deploy to Cloud Run
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#
# jobs:
#   deploy:
#     uses: mrturo-pf/pf-common/.github/workflows/deploy-reusable.yml@main
#     with:
#       repo_name: pf-rates  # service repository name
#     secrets: inherit  # REQUIRED - passes all GitHub secrets to the workflow
# ```
#
# REQUIRED GITHUB SECRETS (must exist in calling repo):
#   GCP_SA_KEY               - GCP service account JSON key
#   GCP_PROJECT_ID           - GCP project ID
#   GCP_CLOUD_SQL_INSTANCE   - (optional) Cloud SQL instance for proxy sidecar
#   GH_PAT                   - (optional) GitHub PAT for private repo access
#   MAIL_SERVER              - SMTP server (e.g. smtp.gmail.com)
#   MAIL_PORT                - SMTP port (e.g. 587)
#   MAIL_USERNAME            - SMTP username
#   MAIL_PASSWORD            - SMTP password
#   MAIL_FROM                - Sender address
#   MAIL_TO                  - Recipient address(es)
#
# Repository-specific secrets are accessed through configured reusable-workflow
# inputs. Dependency service URLs and protected smoke credentials are also passed
# by the caller, so this workflow remains service-agnostic.
#
# ENVIRONMENTS REQUIRED:
#   - GCP (for deployment credentials)
#
# For detailed setup instructions, see docs/deployment.md in each repository.
#
# ==============================================================================

name: Deploy to Cloud Run (Reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        description: 'Repository name (pf-rates, pf-payroll, etc.)'
        required: true
        type: string
      # Deprecated compatibility input. It is intentionally ignored; merges to
      # protected main are the release approval and deployments are automatic.
      require_approval:
        description: 'Deprecated and ignored; retained for caller compatibility'
        required: false
        type: boolean
        default: false
      database_secret_name:
        description: 'Secret Manager name containing this service database URL'
        required: false
        type: string
        default: PF_DATABASE_URL
      workload_identity_provider:
        description: 'Full GitHub OIDC Workload Identity provider resource name'
        required: true
        type: string
      deployer_service_account:
        description: 'Service-specific WIF deployer service account email'
        required: true
        type: string
      dependency_service_name:
        description: 'Optional Cloud Run service whose URL is injected into the deployment'
        required: false
        type: string
        default: ''
      dependency_env_name:
        description: 'Environment variable receiving the dependency service URL'
        required: false
        type: string
        default: ''
      protected_smoke_path:
        description: 'Optional protected endpoint path to smoke-test after deployment'
        required: false
        type: string
        default: ''
      protected_smoke_secret_name:
        description: 'Optional Secret Manager secret containing the protected endpoint key'
        required: false
        type: string
        default: ''

# Deploy concurrency is scoped to the deploy job below. Keeping it out of the
# workflow-level concurrency group prevents a documentation-only run from
# replacing a queued code deployment.

env:
  REGION: us-central1
  AR_REPO: ${{ inputs.repo_name }}
  SERVICE_NAME: ${{ inputs.repo_name }}
  RUNTIME_SA: ${{ inputs.repo_name }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

# NOTE: permissions must be declared by the CALLER workflow, not here

jobs:
  changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ inputs.repo_name }}
          fetch-depth: 0
      - id: classify
        working-directory: ${{ inputs.repo_name }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            files=$(git diff --name-only "${BEFORE_SHA}" "${HEAD_SHA}")
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${files}" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs=$(while IFS= read -r file; do
            case "${file}" in
              *.md|*.mdx|*.rst|*.adoc|docs/*.txt|documentation/*.txt) ;;
              *) printf '%s\n' "${file}" ;;
            esac
          done <<< "${files}")
          if [ -z "${non_docs}" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # test: lint, static analysis, unit + integration tests
  # ----------------------------------------------------------------------------
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout ${{ inputs.repo_name }}
        uses: actions/checkout@v7
        with:
          path: ${{ inputs.repo_name }}

      # pf-common provides shared Makefile targets (lint, dead-code, etc.)
      - name: Checkout pf-common
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: pf-common
          token: ${{ secrets.GH_PAT || github.token }}

      # Checkout pf-common again for composite actions
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python with dependencies
        uses: ./.pf-common/.github/actions/setup-python-deps
        with:
          python-version: '3.14'
          cache-dependency-path: ${{ inputs.repo_name }}/pyproject.toml
          working-directory: ${{ inputs.repo_name }}
          install-extras: '[dev]'

      # pf-db is checked out as a sibling (_pf-db/) so conftest.py can read the
      # SQL test fixtures (schema + seed) without duplicating them in this repo.
      - name: Checkout pf-db (SQL test fixtures)
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-db
          path: _pf-db
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Lint (ruff)
        working-directory: ${{ inputs.repo_name }}
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Dead code (vulture)
        working-directory: ${{ inputs.repo_name }}
        run: make dead-code

      - name: Type check (mypy)
        working-directory: ${{ inputs.repo_name }}
        run: make typecheck

      - name: Duplicate code (jscpd)
        working-directory: ${{ inputs.repo_name }}
        run: |
          make duplicate-code-src
          make duplicate-code-tests
          make duplicate-code

      - name: Run tests with coverage
        working-directory: ${{ inputs.repo_name }}
        env:
          PF_DB_PATH: ../_pf-db
        run: make test-cov

      - name: Install Trivy
        uses: ./.pf-common/.github/actions/install-trivy

      - name: Security scan (trivy fs)
        working-directory: ${{ inputs.repo_name }}
        run: make security-scan

  # ----------------------------------------------------------------------------
  # build: Docker image build, Trivy security scan, release artifact
  # Runs on every push/PR so security findings surface early.
  # The release artifact (tagged for AR) is only produced on push to main.
  # ----------------------------------------------------------------------------
  build:
    name: Build & security scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout ${{ inputs.repo_name }}
        uses: actions/checkout@v7
        with:
          path: ${{ inputs.repo_name }}

      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Build Docker image and export to tar
        uses: ./.pf-common/.github/actions/docker-build-export
        with:
          context: ./${{ inputs.repo_name }}
          image_name: ${{ inputs.repo_name }}:scan
          tar_output: /tmp/${{ inputs.repo_name }}-scan.tar
          no_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify built image matches the current schema contract
        env:
          IMAGE_NAME: ${{ inputs.repo_name }}:scan
        run: |
          set -euo pipefail
          case "${{ inputs.repo_name }}" in
            pf-payroll)
              docker run --rm --entrypoint sh "${IMAGE_NAME}" -c '
                grep -q '\''__tablename__ = "INC_EMPLOYER"'\'' \
                  /opt/venv/lib/python3.12/site-packages/payroll/infrastructure/db/models/payroll.py
                ! grep -q '\''__tablename__ = "PAY_EMPLOYER"'\'' \
                  /opt/venv/lib/python3.12/site-packages/payroll/infrastructure/db/models/payroll.py
              '
              ;;
            pf-rates)
              docker run --rm --entrypoint sh "${IMAGE_NAME}" -c '
                grep -q '\''__tablename__ = "RAT_CURRENCY"'\'' \
                  /opt/venv/lib/python3.12/site-packages/rates/infrastructure/db/models/financial_data.py
              '
              ;;
          esac

      - name: Install Trivy
        uses: ./.pf-common/.github/actions/install-trivy

      - name: Trivy container scan with SARIF upload and gate
        uses: ./.pf-common/.github/actions/trivy-sarif-scan
        with:
          image_tar: /tmp/${{ inputs.repo_name }}-scan.tar
          sarif_file: trivy-results.sarif
          severity: CRITICAL,HIGH

      # Tag and package the release artifact — only needed when deploying
      - name: Tag image for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ inputs.repo_name }}:scan \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker tag ${{ inputs.repo_name }}:scan \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest

      - name: Export release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest \
            -o /tmp/${{ inputs.repo_name }}-release.tar

      - name: Upload release image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-release-${{ github.sha }}
          path: /tmp/${{ inputs.repo_name }}-release.tar
          retention-days: 1

  # deploy: push image to AR, deploy to Cloud Run (only on push to main)
  # Migrations are handled by pf-db before this service receives traffic.
  # The merge to protected main is the release approval.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy service to Cloud Run
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.repo_name }}-production
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: GCP
    outputs:
      service_url: ${{ steps.deployed-url.outputs.url }}
      revision_name: ${{ steps.deploy.outputs.revision_name }}

    steps:
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Download release image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-release-${{ github.sha }}
          path: /tmp

      - name: Authenticate to GCP
        uses: ./.pf-common/.github/actions/gcp-auth
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.deployer_service_account }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Pre-flight check: verify Secret Manager secrets exist before deploying
      # Note: This requires the SA to have secretmanager.viewer permissions
      # If it fails, deployment will continue but may fail later if secrets are missing
      - name: Verify Secret Manager secrets exist (optional)
        continue-on-error: true
        run: |
          set -e
          
          echo "Checking required secrets in Secret Manager..."
          
          # Extract service name without 'pf-' prefix (pf-rates -> RATES)
          SERVICE_NAME_ONLY="$(echo "${{ inputs.repo_name }}" | sed 's/^pf-//')"
          SERVICE_UPPER=$(echo "${SERVICE_NAME_ONLY}" | tr '[:lower:]-' '[:upper:]_')
          API_KEY_SECRET="PF_${SERVICE_UPPER}_API_KEY"
          
          MISSING_SECRETS=()
          
          DATABASE_SECRET="${{ inputs.database_secret_name }}"
          if ! gcloud secrets describe "${DATABASE_SECRET}" --quiet > /dev/null 2>&1; then
            MISSING_SECRETS+=("${DATABASE_SECRET}")
          fi
          
          # Check service-specific API key
          if ! gcloud secrets describe "${API_KEY_SECRET}" --quiet > /dev/null 2>&1; then
            MISSING_SECRETS+=("${API_KEY_SECRET}")
          fi
          
          # For pf-payroll, also check PF_RATES_API_KEY
          if [ "${{ inputs.repo_name }}" = "pf-payroll" ]; then
            if ! gcloud secrets describe PF_RATES_API_KEY --quiet > /dev/null 2>&1; then
              MISSING_SECRETS+=("PF_RATES_API_KEY")
            fi
          fi
          
          # For pf-rates, also check the Google Drive CSV export secret.
          # Powers POST /exports/financial-data. Since the 2026-09-20
          # migration to a Service Account (see
          # docs/google-drive-credentials-setup.md), ADC handles auth --
          # only the destination folder ID is still a secret.
          if [ "${{ inputs.repo_name }}" = "pf-rates" ]; then
            if ! gcloud secrets describe PF_RATES_GDRIVE_EXPORT_FOLDER_ID --quiet > /dev/null 2>&1; then
              MISSING_SECRETS+=("PF_RATES_GDRIVE_EXPORT_FOLDER_ID")
            fi
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: Missing Secret Manager secrets"
            echo "=========================================="
            echo ""
            echo "The following secrets do not exist in Secret Manager:"
            for SECRET in "${MISSING_SECRETS[@]}"; do
              echo "  - ${SECRET}"
            done
            echo ""
            echo "Create them using:"
            echo ""
            for SECRET in "${MISSING_SECRETS[@]}"; do
              if [ "${SECRET}" = "${DATABASE_SECRET}" ]; then
                echo "  echo '<postgresql-connection-string>' | \\\\"
                echo "    gcloud secrets create ${DATABASE_SECRET} --data-file=- --replication-policy=automatic"
              elif [ "${SECRET}" = "PF_RATES_GDRIVE_EXPORT_FOLDER_ID" ]; then
                echo "  echo -n '<google-drive-folder-id>' | \\"
                echo "    gcloud secrets create PF_RATES_GDRIVE_EXPORT_FOLDER_ID --data-file=- --replication-policy=automatic"
              else
                echo "  echo -n \"\$(openssl rand -hex 32)\" | \\"
                echo "    gcloud secrets create ${SECRET} --data-file=- --replication-policy=automatic"
              fi
              echo ""
            done
            echo "Then grant Service Account access:"
            echo ""
            echo "  SA=\"${{ inputs.repo_name }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com\""
            for SECRET in "${MISSING_SECRETS[@]}"; do
              echo "  gcloud secrets add-iam-policy-binding ${SECRET} \\"
              echo "    --member=\"serviceAccount:\${SA}\" \\"
              echo "    --role=\"roles/secretmanager.secretAccessor\""
            done
            echo ""
            echo "=========================================="
            exit 1
          fi
          
          echo "All required secrets exist."

      # Cost-control guard: block the pipeline if Artifact Registry vulnerability
      # scanning is enabled on the repository — it adds ~$5/month per image.
      - name: Verify Artifact Registry scanning is disabled
        run: |
          set -euo pipefail

          if ! STATUS=$(gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
              --location="${{ env.REGION }}" \
              --format="value(vulnerabilityScanningConfig.enablementConfig)" 2>&1); then
            echo " Cannot access Artifact Registry repo '${{ env.AR_REPO }}'"
            echo "Create it first: gcloud artifacts repositories create ${{ env.AR_REPO }} --repository-format=docker --location=${{ env.REGION }}"
            echo "$STATUS"
            exit 1
          fi

          STATUS=$(echo "$STATUS" | grep -E '^(ENABLED|DISABLED)$' | tail -1 || true)
          echo "Vulnerability scanning: ${STATUS:-unknown}"

          if [ "${STATUS}" = "ENABLED" ]; then
            echo " Vulnerability scanning is ENABLED — blocking deploy to prevent ~\$5/month charges."
            echo "Fix: gcloud artifacts repositories update ${{ env.AR_REPO }} --location=${{ env.REGION }} --disable-vulnerability-scanning"
            exit 1
          fi
          echo " Vulnerability scanning disabled."

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Load and push image to Artifact Registry
        run: |
          docker load -i /tmp/${{ inputs.repo_name }}-release.tar
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest

      # Deploy the new service revision.
      # Secret names follow convention: PF_<UPPERCASE_REPO_NAME>_API_KEY
      # e.g., pf-rates → PF_RATES_API_KEY, pf-payroll → PF_PAYROLL_API_KEY
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -eo pipefail
          IMAGE_REPOSITORY="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${{ github.sha }}"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "${IMAGE_TAG}" \
            --format='value(image_summary.digest)')"
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "ERROR: Artifact Registry returned no image digest for ${IMAGE_TAG}"
            exit 1
          fi
          IMAGE="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          echo "Deploying immutable image: ${IMAGE}"
          
          # Secret Manager secrets
          # Always include PF_DATABASE_URL
          # API key follows naming convention: PF_<UPPERCASE_REPO_NAME>_API_KEY
          # Extract the service name without 'pf-' prefix (pf-rates -> RATES, pf-payroll -> PAYROLL)
          SERVICE_NAME_ONLY="$(echo "${{ inputs.repo_name }}" | sed 's/^pf-//')"
          SERVICE_UPPER=$(echo "${SERVICE_NAME_ONLY}" | tr '[:lower:]-' '[:upper:]_')
          API_KEY_SECRET="PF_${SERVICE_UPPER}_API_KEY"
          SECRETS_ARG="PF_DATABASE_URL=${{ inputs.database_secret_name }}:latest,${API_KEY_SECRET}=${API_KEY_SECRET}:latest"

          # Optional: PF_RATES_API_KEY for pf-payroll (calling pf-rates)
          if [ "${{ inputs.repo_name }}" = "pf-payroll" ]; then
            SECRETS_ARG="${SECRETS_ARG},PF_RATES_API_KEY=PF_RATES_API_KEY:latest"
          fi

          # Google Drive CSV export credentials for pf-rates only (powers
          # POST /exports/financial-data). Since the 2026-09-20 migration
          # to a Service Account, only the destination folder ID is a
          # secret -- ADC handles authentication, no OAuth token needed.
          if [ "${{ inputs.repo_name }}" = "pf-rates" ]; then
            SECRETS_ARG="${SECRETS_ARG},PF_RATES_GDRIVE_EXPORT_FOLDER_ID=PF_RATES_GDRIVE_EXPORT_FOLDER_ID:latest"
          fi

          # Plain (non-secret) env vars. PF_RATES_URL is a public Cloud Run
          # URL, not sensitive -- resolved dynamically here instead of
          # hardcoded, since Cloud Run URLs aren't derivable from the
          # project ID alone and this avoids a second manually-maintained
          # copy of it going stale if pf-rates is ever redeployed elsewhere.
          ENV_VARS_ARG="FINANCIAL_DATA_HTTP_PROXY="
          DEPENDENCY_SERVICE="${{ inputs.dependency_service_name }}"
          DEPENDENCY_ENV="${{ inputs.dependency_env_name }}"
          if [ -n "${DEPENDENCY_SERVICE}" ] || [ -n "${DEPENDENCY_ENV}" ]; then
            if [ -z "${DEPENDENCY_SERVICE}" ] || [ -z "${DEPENDENCY_ENV}" ]; then
              echo "ERROR: dependency_service_name and dependency_env_name must be provided together"
              exit 1
            fi
            echo "Resolving dependency Cloud Run URL for ${DEPENDENCY_SERVICE}..."
            DEPENDENCY_URL=$(gcloud run services describe "${DEPENDENCY_SERVICE}" \
              --region="${{ env.REGION }}" --format="value(status.url)")
            if [ -z "${DEPENDENCY_URL}" ]; then
              echo "ERROR: could not resolve dependency service URL"
              exit 1
            fi
            echo "Resolved dependency URL for ${DEPENDENCY_SERVICE}"
            ENV_VARS_ARG="${ENV_VARS_ARG},${DEPENDENCY_ENV}=${DEPENDENCY_URL}"
          fi

          # Build gcloud command with optional Cloud SQL instance
          echo "Building deployment command..."
          GCLOUD_CMD="gcloud run deploy ${{ env.SERVICE_NAME }}"
          GCLOUD_CMD="$GCLOUD_CMD --image=${IMAGE}"
          GCLOUD_CMD="$GCLOUD_CMD --region=${{ env.REGION }}"
          GCLOUD_CMD="$GCLOUD_CMD --platform=managed"
          GCLOUD_CMD="$GCLOUD_CMD --allow-unauthenticated"
          GCLOUD_CMD="$GCLOUD_CMD --service-account=${{ env.RUNTIME_SA }}"
          GCLOUD_CMD="$GCLOUD_CMD --min-instances=0"
          GCLOUD_CMD="$GCLOUD_CMD --max-instances=2"
          GCLOUD_CMD="$GCLOUD_CMD --concurrency=80"
          GCLOUD_CMD="$GCLOUD_CMD --timeout=300"
          GCLOUD_CMD="$GCLOUD_CMD --memory=512Mi"
          GCLOUD_CMD="$GCLOUD_CMD --cpu=1"
          GCLOUD_CMD="$GCLOUD_CMD --port=8080"
          GCLOUD_CMD="$GCLOUD_CMD --set-secrets=${SECRETS_ARG}"
          GCLOUD_CMD="$GCLOUD_CMD --set-env-vars=${ENV_VARS_ARG}"
          GCLOUD_CMD="$GCLOUD_CMD --quiet"
          
          # Add Cloud SQL instance if provided
          CLOUDSQL_INSTANCE="${{ secrets.GCP_CLOUD_SQL_INSTANCE || '' }}"
          if [ -n "${CLOUDSQL_INSTANCE}" ]; then
            echo "Adding Cloud SQL instance: ${CLOUDSQL_INSTANCE}"
            GCLOUD_CMD="$GCLOUD_CMD --add-cloudsql-instances=${CLOUDSQL_INSTANCE}"
          else
            echo "No Cloud SQL instance configured (optional)"
          fi
          
          # Execute deployment
          echo "Executing: ${GCLOUD_CMD}"
          eval "${GCLOUD_CMD}"

          REVISION=""
          for attempt in $(seq 1 30); do
            REVISION=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
              --region="${{ env.REGION }}" \
              --format="value(status.latestCreatedRevisionName)")
            if [ -n "${REVISION}" ]; then
              break
            fi
            echo "Waiting for Cloud Run to report the created revision (attempt ${attempt}/30)..."
            sleep 2
          done
          if [ -z "${REVISION}" ]; then
            echo "ERROR: Cloud Run returned no created revision"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            READY=$(gcloud run revisions describe "${REVISION}" \
              --region="${{ env.REGION }}" --format=json | \
              python3 -c '
          import json
          import sys

          conditions = json.load(sys.stdin).get("status", {}).get("conditions", [])
          ready = next((item.get("status") for item in conditions if item.get("type") == "Ready"), "")
          print(ready)
          ')
            if [ "${READY}" = "True" ]; then
              break
            fi
            echo "Waiting for ${REVISION} to become Ready (attempt ${attempt}/30, status=${READY:-unknown})..."
            sleep 2
          done
          if [ "${READY}" != "True" ]; then
            echo "ERROR: revision ${REVISION} did not become Ready"
            exit 1
          fi

          echo "Deploy revision: ${REVISION}"
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --to-revisions="${REVISION}=100" \
            --quiet
          TRAFFIC_REVISION=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.traffic[0].revisionName)")
          if [ "${TRAFFIC_REVISION}" != "${REVISION}" ]; then
            echo "ERROR: traffic is on ${TRAFFIC_REVISION}, expected ${REVISION}"
            exit 1
          fi
          echo "Verified 100% traffic on ${REVISION}"
          echo "revision_name=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Print deployed service URL
        id: deployed-url
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")
          echo "${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # Run protected smoke checks in the already-authenticated deploy job.
      # The separate public-health job must not perform a second WIF exchange.
      - name: Verify protected endpoint
        if: inputs.protected_smoke_path != '' && inputs.protected_smoke_secret_name != ''
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          cleanup() {
            unset API_KEY
            rm -f "$response_file"
          }
          trap cleanup EXIT

          API_KEY=$(gcloud secrets versions access latest --secret="${{ inputs.protected_smoke_secret_name }}")
          curl_exit=0
          status=$(curl --silent --show-error --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "X-API-Key: ${API_KEY}" \
            "${{ steps.deployed-url.outputs.url }}${{ inputs.protected_smoke_path }}") || curl_exit=$?

          if [ "$curl_exit" -ne 0 ]; then
            echo "ERROR: protected endpoint request failed (curl exit ${curl_exit})"
            exit "$curl_exit"
          fi

          case "${status}" in
            2??)
              echo "Protected endpoint returned ${status}"
              ;;
            *)
              echo "ERROR: protected endpoint returned ${status}"
              echo "Response body (first 4000 bytes):"
              head -c 4000 "$response_file" | sed 's/[[:cntrl:]]//g'
              echo
              exit 1
              ;;
          esac

  # ----------------------------------------------------------------------------
  # smoke-test: verify the freshly deployed revision is actually serving
  # correct traffic — 'gcloud run deploy' only waits for the container to
  # become ready (listening on the port), not for the application itself to
  # be correct. This hits the real public /health endpoint and validates:
  #   - status is "ok"
  #   - service name matches this repo (catches a deploy-to-wrong-service mixup)
  #   - uptime_seconds is small, proving we're talking to the container that
  #     was JUST started for this deploy, not a stale/wrong revision still
  #     serving traffic somewhere
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Verify deployed service health
    concurrency:
      group: deploy-${{ inputs.repo_name }}-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: deploy
    # The deploy job is the only prerequisite; the explicit result check keeps
    # this job from being skipped when earlier PR-only jobs do not run on main.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result == 'success'

    steps:
      # The deploy job already pins 100% of traffic to the new revision and
      # verifies that assignment before exposing its service URL. The smoke
      # test therefore only needs the public health endpoint; authenticating
      # a second time here would add an unnecessary WIF failure point.

      - name: Verify /health reports ok, the right service, and a fresh uptime
        run: |
          set -euo pipefail

          URL="${{ needs.deploy.outputs.service_url }}/health"
          # Cloud Run routes 100% of traffic to the new revision the moment
          # 'gcloud run deploy' returns, and with min-instances=0 the very
          # first request cold-starts a brand-new container — so a genuinely
          # fresh deploy reports uptime in the single digits, not minutes.
          # A high value here is a smoking gun that we're hitting a stale
          # revision instead of the one we just shipped.
          MAX_UPTIME_SECONDS=120

          echo "Checking ${URL} (max ${MAX_UPTIME_SECONDS}s uptime expected)..."

          for attempt in $(seq 1 10); do
            if RESPONSE=$(curl -sf --max-time 15 "${URL}"); then
              echo "Response: ${RESPONSE}"
              RESPONSE="${RESPONSE}" \
              EXPECTED_SERVICE="${{ inputs.repo_name }}" \
              MAX_UPTIME_SECONDS="${MAX_UPTIME_SECONDS}" \
              python3 -c "
          import json, os, sys

          body = json.loads(os.environ['RESPONSE'])
          service = body.get('service')
          uptime = body.get('uptime_seconds')
          expected_service = os.environ['EXPECTED_SERVICE']
          max_uptime = float(os.environ['MAX_UPTIME_SECONDS'])

          if body.get('status') != 'ok':
              sys.exit(f'status is not ok: {body}')
          if service != expected_service:
              sys.exit(
                  f'service mismatch: expected {expected_service!r}, got {service!r} '
                  '— deployed to the wrong Cloud Run service?'
              )
          if not isinstance(uptime, int | float):
              sys.exit(f'uptime_seconds missing or not numeric: {body}')
          if uptime > max_uptime:
              sys.exit(
                  f'uptime_seconds={uptime} exceeds {max_uptime}s — this looks like a '
                  'STALE revision, not the one just deployed'
              )

          print(f'Health check OK — service={service}, uptime_seconds={uptime}')
          "
              exit 0
            fi
            echo "Attempt ${attempt}/10 failed, retrying in 3s..."
            sleep 3
          done

          echo "Health check failed after 10 attempts against ${URL}"
          exit 1

  # ----------------------------------------------------------------------------
  # notify-failure: email alert when any job fails on push to main
  # ----------------------------------------------------------------------------
  notify-failure:
    name: Notify deployment failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy, smoke-test, changes]
    if: |
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.result == 'failure' || needs.test.result == 'failure' ||
       needs.build.result == 'failure' || needs.deploy.result == 'failure' ||
       needs.smoke-test.result == 'failure')

    steps:
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Send failure email
        uses: ./.pf-common/.github/actions/send-email
        with:
          mail_server: ${{ secrets.MAIL_SERVER }}
          mail_port: ${{ secrets.MAIL_PORT }}
          mail_username: ${{ secrets.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ secrets.MAIL_TO }}
          subject: "[FAILED] ${{ inputs.repo_name }} pipeline — ${{ github.ref_name }}"
          body: |
            Deployment pipeline FAILED for ${{ inputs.repo_name }}.

            Failed Jobs:
            - Test & Lint: ${{ needs.test.result }}
            - Build & Scan: ${{ needs.build.result }}
            - Deploy to Cloud Run: ${{ needs.deploy.result }}
            - Smoke Test (Health Check): ${{ needs.smoke-test.result }}

            Details:
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Author: ${{ github.actor }}

            View run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ----------------------------------------------------------------------------
  # notify-success: email confirmation after a successful full deploy
  # ----------------------------------------------------------------------------
  notify-success:
    name: Notify deployment success
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test, changes]
    if: |
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.deploy.result == 'success' &&
      needs.smoke-test.result == 'success'

    steps:
      - name: Checkout pf-common for composite actions
        uses: actions/checkout@v7
        with:
          repository: mrturo-pf/pf-common
          path: .pf-common

      - name: Send success email
        uses: ./.pf-common/.github/actions/send-email
        with:
          mail_server: ${{ secrets.MAIL_SERVER }}
          mail_port: ${{ secrets.MAIL_PORT }}
          mail_username: ${{ secrets.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ secrets.MAIL_TO }}
          subject: "[SUCCESS] ${{ inputs.repo_name }} deployed — ${{ github.ref_name }}"
          body: |
            SUCCESS: ${{ inputs.repo_name }} deployed to Cloud Run.

            Service Details:
            - Name: ${{ inputs.repo_name }}
            - Region: us-central1
            - Image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.repo_name }}/${{ inputs.repo_name }}:${{ github.sha }}

            Deployment Info:
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Author: ${{ github.actor }}
            - Release approval: merge to protected main

            View details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
