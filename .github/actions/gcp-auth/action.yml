# Composite Action: Authenticate to GCP
# ======================================
# Standardizes GCP authentication and gcloud CLI setup

name: 'Authenticate to GCP'
description: 'Authenticate to Google Cloud Platform and configure gcloud CLI'

inputs:
  credentials_json:
    description: 'GCP service account JSON key (temporary fallback)'
    required: false
  workload_identity_provider:
    description: 'Full resource name of the GitHub OIDC Workload Identity provider'
    required: false
  service_account:
    description: 'Service account impersonated through Workload Identity Federation'
    required: false
  project_id:
    description: 'GCP project ID'
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to GCP with Workload Identity Federation
      if: inputs.workload_identity_provider != '' && inputs.service_account != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Authenticate to GCP with temporary JSON key
      if: inputs.workload_identity_provider == '' || inputs.service_account == ''
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ inputs.project_id }}
